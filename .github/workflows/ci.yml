name: CI

on:
  push:
    branches: [main]
    tags: ["v*"] # a release: its SBOMs are kept with the run (docs/runbooks/release.md)
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the suite takes about 5; a hang is stopped, not left for 6 hours
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.lock # what the image ships (#365)
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy  # the types (#440): [tool.mypy] in pyproject.toml
      - run: pytest

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint  # ESLint (#442): eslint.config.*
      - run: npm test
      - run: npm run build

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # the rules are tested without starting Electron
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/desktop/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint  # ESLint (#442): eslint.config.*
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck deploy/*.sh
      - run: docker build -t mocktrade:ci .
      - name: compose file is valid
        run: |
          printf 'MOCKTRADE_DOMAIN=localhost\nMOCKTRADE_SECRET_KEY=placeholder\n' > deploy/.env
          docker compose -f deploy/compose.yaml config --quiet
      - name: image starts locked down, answers, and stops cleanly
        run: deploy/smoke.sh mocktrade:ci

  supply-chain:
    # #365: known vulnerabilities in what we ship, secrets in the history, and the SBOMs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the whole history: a secret removed later is still leaked
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install pip-audit==2.10.1 cyclonedx-bom==7.5.0
      - name: Python dependencies have no known vulnerability
        run: pip-audit -r requirements.lock --no-deps --disable-pip --strict
      - name: no secret anywhere in the history
        env:
          GITLEAKS: "8.21.2"
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner .
      - name: SBOMs (CycloneDX) of the server, the screens and the desktop app
        run: |
          mkdir sbom
          cyclonedx-py requirements requirements.lock --output-format JSON -o sbom/mocktrade-server.cdx.json
          (cd ui && npm ci --no-audit --no-fund && npm sbom --sbom-format cyclonedx --omit dev) > sbom/mocktrade-screens.cdx.json
          # all of it: Electron (a dev dependency to npm) is inside the installer
          (cd ui/desktop && npm ci --no-audit --no-fund && npm sbom --sbom-format cyclonedx) > sbom/mocktrade-desktop.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          # a release: sbom-vX.Y.Z; otherwise the commit (a PR's ref has a '/', not allowed here)
          name: sbom-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          path: sbom/
