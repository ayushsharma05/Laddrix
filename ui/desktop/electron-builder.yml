# Builds the Windows installer: npm run dist:win (on Windows, or anywhere with wine).
appId: in.laddrix.desktop
productName: Laddrix
copyright: Laddrix
directories:
  output: release
files:
  - dist/**/*.js
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Laddrix
