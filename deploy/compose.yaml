# MockTrade on one server: the app behind Caddy (HTTPS certificates automatically).
#
#   cp deploy/.env.example deploy/.env      # then fill it in (never commit it)
#   docker compose -f deploy/compose.yaml up -d --build
#   docker compose -f deploy/compose.yaml run --rm -it app python -m mocktrade.tools.users add-user ...
#
# Only Caddy is reachable from outside (ports 80/443). The app listens on the private
# network, runs as a non-root user on a read-only filesystem, and keeps its data
# (users, audit trail, broker tokens) in the `data` volume.
#
# Monitoring (optional, #287): Prometheus and Grafana, started only when asked for:
#   docker compose -f deploy/compose.yaml --profile monitoring up -d
# Grafana listens on this machine only (127.0.0.1:3000): reach it through an SSH tunnel
# (docs/runbooks/monitoring.md). It needs MOCKTRADE_METRICS_TOKEN in deploy/.env.

name: mocktrade

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mocktrade:latest
    env_file: .env
    environment:
      MOCKTRADE_ORIGIN: https://${MOCKTRADE_DOMAIN:?set MOCKTRADE_DOMAIN in deploy/.env}
      MOCKTRADE_TRUSTED_PROXIES: "*" # only Caddy can reach the app: believe its X-Forwarded-For
    volumes:
      - data:/data
    expose:
      - "8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s # time to finish requests and flush the audit trail
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        # started, not healthy: the app's health is readiness (#287), and a server that is
        # up but not ready (a failed recovery, no prices) must still show its screens
        condition: service_started
    environment:
      MOCKTRADE_DOMAIN: ${MOCKTRADE_DOMAIN:?set MOCKTRADE_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep them, or Let's Encrypt limits may bite
      - caddy_config:/config
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging: *logs

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_token
    expose:
      - "9090"
    restart: unless-stopped
    # not read_only: Compose writes the key in as the container starts (an environment secret)
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logs

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.3.0
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mocktrade.json
    ports:
      - "127.0.0.1:3000:3000" # this machine only: an SSH tunnel, never the internet
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logs

secrets:
  metrics_token:
    environment: MOCKTRADE_METRICS_TOKEN # from deploy/.env; Prometheus reads it as a file

volumes:
  data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
