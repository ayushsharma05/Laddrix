[project]
name = "mocktrade"
version = "1.0.0rc1"
description = "A multi-user, broker-agnostic trading platform for NSE/BSE (first broker: Zerodha Kite Connect)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=43",
    "orjson>=3.10",  # tick encoding: 4x faster than json (docs/design/performance.md)
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
# Historical context generators and session-specific mutation harnesses are
# preserved as evidence, not maintained application modules. Source and tests
# remain subject to every existing rule; runnable tools live under src/.
extend-exclude = ["context/backlog-scripts", "context/build-map", "context/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
